<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Book</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        linen: {
                            50: '#FDFBF7',
                            100: '#F8F6F0',
                            200: '#F0ECE1',
                            300: '#E5E5E0',
                            400: '#D4D4CE'
                        },
                        charcoal: {
                            700: '#3F3F46',
                            800: '#27272A',
                            900: '#18181B'
                        },
                        terracotta: {
                            600: '#B45309',
                            700: '#92400E'
                        }
                    },
                    fontFamily: {
                        serif: ['Cormorant Garamond', 'Georgia', 'serif'],
                        sans: ['Plus Jakarta Sans', '-apple-system', 'BlinkMacSystemFont', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #F8F6F0;
            color: #18181B;
        }

        .paper-texture {
            background-color: #F8F6F0;
            background-image: radial-gradient(#E5E5E0 0.75px, transparent 0.75px);
            background-size: 16px 16px;
        }

        /* Custom subtle scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #F8F6F0;
        }
        ::-webkit-scrollbar-thumb {
            background: #D4D4CE;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #A1A1AA;
        }

        .story-card {
            background: #FFFFFF;
            border: 1px solid #E5E5E0;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s ease;
        }
        .story-card:hover {
            transform: translateY(-4px);
            border-color: #D4D4CE;
            box-shadow: 0 16px 32px -8px rgba(24, 24, 27, 0.06);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Focus rings for keyboard accessibility */
        button:focus-visible, a:focus-visible {
            outline: 2px solid #18181B;
            outline-offset: 2px;
        }
    </style>
</head>
<body class="paper-texture font-sans min-h-screen flex flex-col antialiased selection:bg-charcoal-900 selection:text-white">

    <!-- ================= NAVIGATION HEADER ================= -->
    <header class="border-b border-linen-300 bg-[#F8F6F0]/90 sticky top-0 z-30 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl border border-linen-300 bg-white flex items-center justify-center text-charcoal-900 shadow-sm shrink-0">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/>
                        <path d="M6.5 6H20"/>
                    </svg>
                </div>
                <span class="font-serif text-2xl font-semibold text-charcoal-900 tracking-tight leading-none">Story Book</span>
            </div>

            <div class="text-xs text-zinc-500 font-medium tracking-wide">
                Photo Album
            </div>

        </div>
    </header>

    <!-- ================= HERO COVER ================= -->
    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 sm:pt-8 pb-4 w-full">
        <div class="relative w-full rounded-3xl border border-linen-300 bg-white p-3 sm:p-4 shadow-sm">
            <div class="relative h-[260px] sm:h-[360px] md:h-[420px] w-full rounded-2xl overflow-hidden bg-linen-200">
                
                <img src="https://images.unsplash.com/photo-1511895426328-dc8714191300?auto=format&fit=crop&w=2000&q=80" 
                     alt="Cover photo" class="w-full h-full object-cover filter brightness-[0.92] contrast-[1.02]">
                
                <div class="absolute inset-0 bg-gradient-to-t from-charcoal-900/80 via-charcoal-900/20 to-transparent"></div>

                <div class="absolute bottom-0 left-0 right-0 p-6 sm:p-10 text-white">
                    <h1 class="font-serif text-4xl sm:text-6xl md:text-7xl font-semibold tracking-tight leading-none">
                        Story Book
                    </h1>
                </div>

            </div>
        </div>
    </section>

    <!-- ================= MAIN CONTENT & CATEGORIES ================= -->

        <!-- CATEGORY NAVIGATION BAR -->
        <div class="flex items-center justify-between border-b border-linen-300 pb-5">
            
            <div class="flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar" id="category-bar" role="tablist" aria-label="Photo categories">

                    <svg class="w-4 h-4 shrink-0 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="3" width="7" height="7" rx="1.5"/>
                        <rect x="14" y="3" width="7" height="7" rx="1.5"/>
                        <rect x="14" y="14" width="7" height="7" rx="1.5"/>
                        <rect x="3" y="14" width="7" height="7" rx="1.5"/>
                    </svg>
                    <span>All</span>
                </button>

                <!-- EVERYDAY -->
                <button onclick="filterCategory('Everyday')" data-cat="Everyday" role="tab" aria-selected="false" class="cat-pill px-4 py-2 rounded-xl text-xs font-medium flex items-center gap-2 transition-all border border-zinc-200 bg-white text-zinc-600 hover:border-zinc-300 hover:bg-zinc-50 shrink-0">

                    <svg class="w-4 h-4 shrink-0 text-zinc-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

                    <span>Family</span>

                <!-- SPECIAL MOMENTS -->
                <button onclick="filterCategory('Special Moments')" data-cat="Special Moments" role="tab" aria-selected="false" class="cat-pill px-4 py-2 rounded-xl text-xs font-medium flex items-center gap-2 transition-all border border-zinc-200 bg-white text-zinc-600 hover:border-zinc-300 hover:bg-zinc-50 shrink-0">
                    <svg class="w-4 h-4 shrink-0 text-zinc-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z"/>
                    </svg>
                    <span>Special Moments</span>
                </button>

            </div>

            <div class="text-xs text-zinc-500 font-medium shrink-0 hidden sm:block">
                <span id="memory-count" class="font-semibold text-charcoal-900">0</span> memories
            </div>

        </div>

        <!-- PHOTO GALLERY GRID -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6" id="gallery-grid">
            <!-- Dynamic Photo Cards Render Here -->
        </div>

    </main>

    <!-- ================= FOOTER ================= -->
    <footer class="border-t border-linen-300 bg-white py-8 mt-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between text-xs text-zinc-400">
            <div class="font-serif text-lg font-semibold text-charcoal-900">Story Book</div>
            <div>Photo Album</div>
        </div>
    </footer>

    <!-- ================= FULLSCREEN LIGHTBOX MODAL ================= -->
    <div id="lightbox" class="fixed inset-0 z-50 hidden bg-charcoal-900/90 backdrop-blur-md flex items-center justify-center p-4 sm:p-6" role="dialog" aria-modal="true" aria-labelledby="lb-title">
        <div class="relative max-w-4xl w-full bg-white rounded-3xl overflow-hidden shadow-2xl flex flex-col md:flex-row max-h-[90vh]">
            
            <button onclick="closeLightbox()" aria-label="Close dialog" class="absolute top-4 right-4 z-20 w-9 h-9 rounded-full bg-charcoal-900/60 hover:bg-charcoal-900 text-white flex items-center justify-center text-sm transition-colors">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
            </button>

            <div class="relative flex-1 bg-charcoal-900 flex items-center justify-center min-h-[300px] md:min-h-[480px]">
                <img id="lb-image" src="" alt="" class="max-h-[75vh] w-auto max-w-full object-contain p-2">
                
                <button onclick="navigateLightbox(-1)" aria-label="Previous photo" class="absolute left-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-white/20 hover:bg-white/40 text-white flex items-center justify-center transition-all">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M15 18l-6-6 6-6"/>
                    </svg>
                </button>
                <button onclick="navigateLightbox(1)" aria-label="Next photo" class="absolute right-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-white/20 hover:bg-white/40 text-white flex items-center justify-center transition-all">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M9 18l6-6-6-6"/>

            <div class="w-full md:w-80 p-6 sm:p-8 bg-linen-50 flex flex-col justify-between border-t md:border-t-0 md:border-l border-linen-300 overflow-y-auto">
                <div class="space-y-4">
                    <div class="flex items-center justify-between text-xs text-terracotta-600 font-semibold">
                        <span id="lb-date"></span>
                        <span id="lb-category-pill" class="px-2.5 py-1 bg-linen-200 text-charcoal-800 rounded-lg text-[11px] font-medium flex items-center gap-1.5"></span>
                    </div>

                    <div class="w-8 h-0.5 bg-terracotta-600"></div>

                    <p id="lb-description" class="text-xs sm:text-sm text-charcoal-700 leading-relaxed font-normal"></p>
                </div>

                <div class="pt-6 mt-6 border-t border-linen-300 text-xs text-zinc-400 flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>
                        <circle cx="12" cy="10" r="3"/>
                    </svg>
                    <span id="lb-location"></span>
                </div>
            </div>

        </div>
    </div>

    <!-- ================= JAVASCRIPT APPLICATION CODE ================= -->

            'Childhood': `<svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="3.5"/><path d="M8.5 16.5l3.5-9 3.5 9M9.8 13.2h4.4"/></svg>`,
            'Family': `<svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-1.5a2.5 2.5 0 0 0-2.5-2.5h-3A2.5 2.5 0 0 0 8 19.5V21"/><circle cx="12" cy="13" r="2.25"/><path d="M8 11.5v-1a2 2 0 0 0-2-2H4.5A2 2 0 0 0 2.5 10.5V12"/><circle cx="5.5" cy="5.5" r="1.75"/><path d="M21.5 12v-1.5a2 2 0 0 0-2-2H18a2 2 0 0 0-2 2v1"/><circle cx="18.5" cy="5.5" r="1.75"/></svg>`,
            'Special Moments': `<svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z"/></svg>`
        };

        const MEMORIES = [
            {
                id: 'mem-1',

            },
            {
                id: 'mem-2',

            },
            {
                id: 'mem-3',
                title: 'Sunday Morning Breakfast',
                date: 'October 2012',
                location: 'Home Kitchen',
                category: 'Everyday',
                description: 'Fresh coffee brewing while mixing blueberry pancake batter in the yellow ceramic bowl on a sunny weekend morning.',
                imageUrl: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=1200&q=80'
            },
            {
                id: 'mem-4',
                title: 'Silver Wedding Anniversary Toast',
                date: 'September 2018',
                location: 'Napa Valley, California',
                category: 'Special Moments',
                description: 'Celebrating twenty-five years surrounded by family at an outdoor vineyard table during sunset.',
                imageUrl: 'https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1200&q=80'

            {

                title: 'Treehouse Construction in the Garden',

                location: 'Backyard Garden',

                description: 'Building a wooden fort in the branches of the old oak tree using scrap cedar planks and leftover paint.',

            },
            {
                id: 'mem-8',
                title: 'Rainy Afternoon Board Games',
                date: 'November 2016',

                category: 'Everyday',
                description: 'A heavy autumn rain held everyone indoors, so we lit the fireplace and spent the afternoon playing classic tabletop games.',
                imageUrl: 'https://images.unsplash.com/photo-1511193311914-0346f16efe90?auto=format&fit=crop&w=1200&q=80'
            },
            {
                id: 'mem-9',
                title: 'Graduation Day on the Lawn',
                date: 'June 2017',
                location: 'University Campus Lawn',
                category: 'Special Moments',
                description: 'Gathered on the main quad following the commencement ceremony under clear blue summer skies.',
                imageUrl: 'https://images.unsplash.com/photo-1523050854058-8df90110c9f1?auto=format&fit=crop&w=1200&q=80'
            },
            {
                id: 'mem-10',

                date: 'October 2021',
                location: 'Blue Ridge Mountains',
                category: 'Family',
                description: 'Walking through golden maple and aspen trees along the mountain ridge trail during the peak of foliage season.',
                imageUrl: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80'
            }
        ];

        let currentCategory = 'All';
        let filteredMemories = [...MEMORIES];
        let currentLightboxIndex = -1;

        document.addEventListener('DOMContentLoaded', () => {
            renderGallery();

            // Keyboard navigation for lightbox
            document.addEventListener('keydown', (e) => {
                const lb = document.getElementById('lightbox');
                if (!lb.classList.contains('hidden')) {
                    if (e.key === 'Escape') closeLightbox();
                    if (e.key === 'ArrowLeft') navigateLightbox(-1);
                    if (e.key === 'ArrowRight') navigateLightbox(1);
                }
            });
        });

        function filterCategory(cat) {
            currentCategory = cat;

            document.querySelectorAll('.cat-pill').forEach(btn => {
                const btnCat = btn.getAttribute('data-cat');
                const svg = btn.querySelector('svg');
                if (btnCat === cat) {
                    btn.setAttribute('aria-selected', 'true');
                    btn.className = "cat-pill active px-4 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 transition-all border border-charcoal-900 bg-charcoal-900 text-white shadow-sm shrink-0";
                    if (svg) {
                        svg.classList.remove('text-zinc-500');
                        svg.classList.add('text-white');
                    }
                } else {
                    btn.setAttribute('aria-selected', 'false');
                    btn.className = "cat-pill px-4 py-2 rounded-xl text-xs font-medium flex items-center gap-2 transition-all border border-zinc-200 bg-white text-zinc-600 hover:border-zinc-300 hover:bg-zinc-50 shrink-0";
                    if (svg) {
                        svg.classList.remove('text-white');
                        svg.classList.add('text-zinc-500');
                    }
                }
            });

            renderGallery();
        }

        function renderGallery() {
            const grid = document.getElementById('gallery-grid');

            filteredMemories = MEMORIES.filter(item => {
                return (currentCategory === 'All') || (item.category === currentCategory);
            });

            document.getElementById('memory-count').textContent = filteredMemories.length;

            grid.innerHTML = filteredMemories.map((item, idx) => `
                <article class="story-card rounded-3xl overflow-hidden cursor-pointer group animate-fade-in flex flex-col justify-between" onclick="openLightbox(${idx})">
                    
                    <div>
                        <div class="relative h-56 sm:h-60 w-full overflow-hidden bg-linen-200">
                            <img src="${item.imageUrl}" alt="${escapeHtml(item.title)}" 
                                 class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
                                 onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1511895426328-dc8714191300?auto=format&fit=crop&w=800&q=80';">
                            
                            <div class="absolute top-3.5 right-3.5 px-3 py-1 bg-white/90 backdrop-blur-md text-charcoal-900 border border-linen-300 rounded-xl text-[11px] font-semibold flex items-center gap-1.5 shadow-sm">
                                ${CATEGORY_ICONS[item.category] || ''}
                                <span>${escapeHtml(item.category)}</span>
                            </div>
                        </div>

                        <div class="p-6 space-y-3">
                            <div class="flex items-center justify-between text-xs font-semibold text-terracotta-600">
                                <span>${escapeHtml(item.date)}</span>
                                <span class="text-zinc-400 font-normal flex items-center gap-1">
                                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                        <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>
                                        <circle cx="12" cy="10" r="3"/>
                                    </svg>
                                    ${escapeHtml(item.location)}
                                </span>
                            </div>

                            <h3 class="font-serif text-2xl font-semibold text-charcoal-900 group-hover:text-terracotta-600 transition-colors leading-snug">
                                ${escapeHtml(item.title)}
                            </h3>

                            <p class="text-xs text-charcoal-700 leading-relaxed line-clamp-3 font-normal">
                                ${escapeHtml(item.description)}
                            </p>
                        </div>
                    </div>

                </article>
            `).join('');
        }

        function openLightbox(idx) {
            currentLightboxIndex = idx;
            const item = filteredMemories[idx];
            if (!item) return;

            document.getElementById('lb-image').src = item.imageUrl;
            document.getElementById('lb-image').alt = item.title;
            document.getElementById('lb-date').textContent = item.date;
            document.getElementById('lb-category-pill').innerHTML = `${CATEGORY_ICONS[item.category] || ''} ${escapeHtml(item.category)}`;
            document.getElementById('lb-title').textContent = item.title;
            document.getElementById('lb-description').textContent = item.description;
            document.getElementById('lb-location').textContent = item.location;

            document.getElementById('lightbox').classList.remove('hidden');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.add('hidden');
        }

        function navigateLightbox(dir) {
            if (filteredMemories.length === 0) return;
            currentLightboxIndex += dir;
            if (currentLightboxIndex < 0) currentLightboxIndex = filteredMemories.length - 1;
            if (currentLightboxIndex >= filteredMemories.length) currentLightboxIndex = 0;
            openLightbox(currentLightboxIndex);
        }

        function escapeHtml(str) {
            return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
