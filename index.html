<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Book</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        linen: {
                            50: '#FDFBF7',
                            100: '#FAF8F5',
                            200: '#F4F0E6',
                            300: '#EFEBE1',
                            400: '#E2DDCF'
                        },
                        charcoal: {
                            700: '#3F3F46',
                            800: '#27272A',
                            900: '#18181B'
                        },
                        terracotta: {
                            600: '#B45309',
                            700: '#92400E'
                        }
                    },
                    fontFamily: {
                        serif: ['Cormorant Garamond', 'Georgia', 'serif'],
                        sans: ['Plus Jakarta Sans', '-apple-system', 'BlinkMacSystemFont', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background: radial-gradient(circle at 50% 0%, #FAF8F5 0%, #F4F0E6 50%, #EFEBE1 100%);
            background-attachment: fixed;
            color: #18181B;
        }

        /* Remove default black focus rings across interactive controls */
        button:focus, a:focus, button:focus-visible, a:focus-visible, [tabindex]:focus {
            outline: none !important;
            box-shadow: none !important;
        }

        /* Subtle scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #FAF8F5;
        }
        ::-webkit-scrollbar-thumb {
            background: #E2DDCF;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #A1A1AA;
        }

        /* Story Card hover effects */
        .story-card {
            background: #FFFFFF;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform, box-shadow;
        }
        .story-card:hover {
            transform: translateY(-4px) scale(1.005);
            box-shadow: 0 20px 40px -12px rgba(24, 24, 27, 0.08);
        }
        .story-card:active {
            transform: translateY(-1px) scale(0.99);
        }

        /* Hero cover image zoom */
        .hero-cover-img {
            transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .hero-cover-container:hover .hero-cover-img {
            transform: scale(1.025);
        }

        /* Category pill button transitions */
        .cat-pill {
            transition: background-color 0.2s cubic-bezier(0.16, 1, 0.3, 1), 
                        color 0.2s cubic-bezier(0.16, 1, 0.3, 1), 
                        transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), 
                        box-shadow 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .cat-pill:hover {
            transform: translateY(-1.5px);
        }
        .cat-pill:active {
            transform: translateY(0) scale(0.97);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Staggered Cascade Entrance Animation */
        @keyframes staggerIn {
            from { 
                opacity: 0; 
                transform: translateY(14px) scale(0.98); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0) scale(1); 
            }
        }
        .animate-stagger-card {
            animation: staggerIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        /* Lightbox Backdrop Fade */
        @keyframes backdropFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Lightbox Modal Card Scale-up */
        @keyframes modalScaleUp {
            from { 
                opacity: 0; 
                transform: scale(0.95) translateY(8px); 
            }
            to { 
                opacity: 1; 
                transform: scale(1) translateY(0); 
            }
        }

        .modal-backdrop {
            transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .modal-backdrop:not(.hidden) {
            animation: backdropFadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .modal-backdrop:not(.hidden) #lb-card-container {
            animation: modalScaleUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Direction-Aware Slide Animations for Lightbox */
        .lb-slide-right {
            animation: slideInRight 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .lb-slide-left {
            animation: slideInLeft 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .lb-fade-swap {
            animation: fadeSwap 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideInRight {
            0% { opacity: 0.15; transform: translateX(36px) scale(0.98); }
            100% { opacity: 1; transform: translateX(0) scale(1); }
        }
        @keyframes slideInLeft {
            0% { opacity: 0.15; transform: translateX(-36px) scale(0.98); }
            100% { opacity: 1; transform: translateX(0) scale(1); }
        }
        @keyframes fadeSwap {
            0% { opacity: 0.2; transform: scale(0.97); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Image Lazy Load Fade-In */
        .img-fade-in {
            opacity: 0;
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .img-fade-in.loaded {
            opacity: 1;
        }

        /* Respect reduced motion preference */
        @media (prefers-reduced-motion: reduce) {
            *, ::before, ::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body class="font-sans min-h-screen flex flex-col antialiased selection:bg-charcoal-900 selection:text-white relative">

                category: 'Childhood',
                description: 'Building a wooden fort in the branches of the old oak tree using scrap cedar planks and leftover paint.',
                imageUrl: 'https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1200&q=80'
            },
            {
                id: 'mem-8',
                title: 'Rainy Afternoon Board Games',
                date: 'November 2016',
                category: 'Everyday',
                description: 'A heavy autumn rain held everyone indoors, so we lit the fireplace and spent the afternoon playing classic tabletop games.',
                imageUrl: 'https://images.unsplash.com/photo-1511193311914-0346f16efe90?auto=format&fit=crop&w=1200&q=80'
            },
            {
                id: 'mem-9',
                title: 'Graduation Day on the Lawn',
                date: 'June 2017',
                category: 'Special Moments',
                description: 'Gathered on the main quad following the commencement ceremony under clear blue summer skies.',
                imageUrl: 'https://images.unsplash.com/photo-1523050854058-8df90110c9f1?auto=format&fit=crop&w=1200&q=80'
            },
            {
                id: 'mem-10',
                title: 'Autumn Trail Hike',
                date: 'October 2021',
                category: 'Family',
                description: 'Walking through golden maple and aspen trees along the mountain ridge trail during the peak of foliage season.',
                imageUrl: 'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1200&q=80'
            }
        ];

        let currentCategory = 'All';
        let filteredMemories = [...MEMORIES];
        let currentLightboxIndex = -1;
        let activeTriggerElement = null;

        // Mobile touch swipe tracking
        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener('DOMContentLoaded', () => {
            renderGallery();

            // Keyboard navigation & shortcuts
            document.addEventListener('keydown', (e) => {
                const lb = document.getElementById('lightbox');
                if (!lb.classList.contains('hidden')) {
                    if (e.key === 'Escape') closeLightbox();
                    if (e.key === 'ArrowLeft') navigateLightbox(-1);
                    if (e.key === 'ArrowRight') navigateLightbox(1);
                }
            });

            // Close modal on backdrop click
            const lbModal = document.getElementById('lightbox');
            lbModal.addEventListener('click', (e) => {
                if (e.target === lbModal) closeLightbox();
            });

            // Touch swipe handlers
            lbModal.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });

            lbModal.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, { passive: true });
        });

        function handleSwipe() {
            const threshold = 40;
            if (touchEndX < touchStartX - threshold) {
                navigateLightbox(1);  // Swipe left -> next
            } else if (touchEndX > touchStartX + threshold) {
                navigateLightbox(-1); // Swipe right -> prev
            }
        }

        function filterCategory(cat) {
            currentCategory = cat;

            document.querySelectorAll('.cat-pill').forEach(btn => {
                const btnCat = btn.getAttribute('data-cat');
                const svg = btn.querySelector('svg');
                if (btnCat === cat) {
                    btn.setAttribute('aria-selected', 'true');
                    btn.className = "cat-pill active px-4 py-2.5 rounded-2xl text-xs font-semibold flex items-center gap-2 bg-charcoal-900 text-white shadow-sm shrink-0";
                    if (svg) {
                        svg.classList.remove('text-zinc-500');
                        svg.classList.add('text-white');
                    }
                } else {
                    btn.setAttribute('aria-selected', 'false');
                    btn.className = "cat-pill px-4 py-2.5 rounded-2xl text-xs font-medium flex items-center gap-2 bg-white text-zinc-700 hover:bg-zinc-100 shrink-0";
                    if (svg) {
                        svg.classList.remove('text-white');
                        svg.classList.add('text-zinc-500');
                    }
                }
            });

            renderGallery();
        }

        function renderGallery() {
            const grid = document.getElementById('gallery-grid');

            filteredMemories = MEMORIES.filter(item => {
                return (currentCategory === 'All') || (item.category === currentCategory);
            });

            if (filteredMemories.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-16 text-center space-y-3">
                        <div class="w-12 h-12 rounded-2xl bg-white mx-auto flex items-center justify-center text-zinc-400 shadow-sm">
                            <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                        </div>
                        <p class="text-sm font-medium text-charcoal-700">No photographs found in this category.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filteredMemories.map((item, idx) => {
                const aspectClass = ASPECT_RATIOS[idx % ASPECT_RATIOS.length];
                const staggerDelay = (idx * 40) + 'ms';
                return `
                <article class="story-card rounded-3xl overflow-hidden cursor-pointer group animate-stagger-card flex flex-col justify-between" 
                         style="animation-delay: ${staggerDelay};"
                         onclick="openLightbox(${idx}, this)" 
                         tabindex="0"
                         onkeydown="if(event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openLightbox(${idx}, this); }">
                    
                    <div>
                        <div class="relative ${aspectClass} w-full overflow-hidden bg-linen-200">
                            <img src="${item.imageUrl}" alt="${escapeHtml(item.title)}" 
                                 class="w-full h-full object-cover transition-transform duration-500 ease-out group-hover:scale-[1.04] img-fade-in"
                                 loading="lazy"
                                 decoding="async"
                                 onload="this.classList.add('loaded')"
                                 onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1511895426328-dc8714191300?auto=format&fit=crop&w=1200&q=80'; this.classList.add('loaded');">
                            
                            <div class="absolute top-3.5 right-3.5 px-3 py-1 bg-white/90 backdrop-blur-md text-charcoal-900 rounded-xl text-[11px] font-semibold flex items-center gap-1.5 shadow-sm transition-transform duration-200 group-hover:scale-105">
                                ${CATEGORY_ICONS[item.category] || ''}
                                <span>${escapeHtml(item.category)}</span>
                            </div>
                        </div>

                        <div class="p-6 space-y-3">
                            <div class="text-xs font-semibold text-terracotta-600">
                                <span>${escapeHtml(item.date)}</span>
                            </div>

                            <h3 class="font-serif text-2xl font-semibold text-charcoal-900 group-hover:text-terracotta-600 transition-colors leading-snug">
                                ${escapeHtml(item.title)}
                            </h3>

                            <p class="text-xs text-charcoal-700 leading-relaxed line-clamp-3 font-normal">
                                ${escapeHtml(item.description)}
                            </p>
                        </div>
                    </div>

                </article>
            `}).join('');
        }

        function openLightbox(idx, triggerEl = null, dir = 0) {
            currentLightboxIndex = idx;
            if (triggerEl) activeTriggerElement = triggerEl;

            const item = filteredMemories[idx];
            if (!item) return;

            const imgEl = document.getElementById('lb-image');
            const panelEl = document.getElementById('lb-details-panel');

            // Apply direction-aware horizontal slide animations
            imgEl.classList.remove('lb-fade-swap', 'lb-slide-right', 'lb-slide-left');
            panelEl.classList.remove('lb-fade-swap', 'lb-slide-right', 'lb-slide-left');
            
            void imgEl.offsetWidth; // Force CSS animation reflow

            if (dir > 0) {
                imgEl.classList.add('lb-slide-right');
                panelEl.classList.add('lb-slide-right');
            } else if (dir < 0) {
                imgEl.classList.add('lb-slide-left');
                panelEl.classList.add('lb-slide-left');
            } else {
                imgEl.classList.add('lb-fade-swap');
                panelEl.classList.add('lb-fade-swap');
            }

            imgEl.onerror = function() {
                this.onerror = null;
                this.src = 'https://images.unsplash.com/photo-1511895426328-dc8714191300?auto=format&fit=crop&w=1200&q=80';
            };
            imgEl.src = item.imageUrl;
            imgEl.alt = item.title;
            
            document.getElementById('lb-date').textContent = item.date;
            document.getElementById('lb-category-pill').innerHTML = `${CATEGORY_ICONS[item.category] || ''} ${escapeHtml(item.category)}`;
            document.getElementById('lb-title').textContent = item.title;
            document.getElementById('lb-description').textContent = item.description;

            preloadNeighborImages(idx);

            const lbModal = document.getElementById('lightbox');
            lbModal.classList.remove('hidden');
            
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            const lbModal = document.getElementById('lightbox');
            lbModal.classList.add('hidden');
            
            document.body.style.overflow = '';

            if (activeTriggerElement) {
                activeTriggerElement.focus();
                activeTriggerElement = null;
            }
        }

        function navigateLightbox(dir) {
            if (filteredMemories.length === 0) return;
            currentLightboxIndex += dir;
            if (currentLightboxIndex < 0) currentLightboxIndex = filteredMemories.length - 1;
            if (currentLightboxIndex >= filteredMemories.length) currentLightboxIndex = 0;
            openLightbox(currentLightboxIndex, null, dir);
        }

        function preloadNeighborImages(idx) {
            if (filteredMemories.length <= 1) return;
            const prevIdx = (idx - 1 + filteredMemories.length) % filteredMemories.length;
            const nextIdx = (idx + 1) % filteredMemories.length;
            
            const imgPrev = new Image();
            imgPrev.src = filteredMemories[prevIdx].imageUrl;
            
            const imgNext = new Image();
            imgNext.src = filteredMemories[nextIdx].imageUrl;
        }

        function escapeHtml(str) {
            return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
