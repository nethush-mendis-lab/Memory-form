<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Book</title>
    
    <!-- Google Fonts & Domain Preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://images.unsplash.com">
    <link rel="dns-prefetch" href="https://images.unsplash.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        linen: {
                            50: '#FDFBF7',
                            100: '#FAF8F5',
                            200: '#F4F0E6',
                            300: '#EFEBE1',
                            400: '#E2DDCF'
                        },
                        charcoal: {
                            700: '#3F3F46',
                            800: '#27272A',
                            900: '#18181B'
                        },
                        terracotta: {
                            600: '#B45309',
                            700: '#92400E'
                        }
                    },
                    fontFamily: {
                        serif: ['Cormorant Garamond', 'Georgia', 'serif'],
                        sans: ['Plus Jakarta Sans', '-apple-system', 'BlinkMacSystemFont', 'sans-serif']
                    }
                }

        }

    <style>
        /* Warm Editorial Background */
        body {
            background: radial-gradient(circle at 50% 0%, #FAF8F5 0%, #F4F0E6 50%, #EFEBE1 100%);
            background-attachment: fixed;
            color: #18181B;
        }

        /* Warm Custom Selection Highlight - Replaces pitch black background boxes */
        ::selection {
            background-color: #E6E0D3;
            color: #1C1917;
        }
        ::-moz-selection {
            background-color: #E6E0D3;
            color: #1C1917;
        }

        /* Disable text selection and drag previews on cards, buttons, badges, and images */
        .story-card, .cat-pill, button, img, svg, .no-select {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* Remove default black focus outline rings */
        button:focus, a:focus, button:focus-visible, a:focus-visible, [tabindex]:focus {
            outline: none !important;
            box-shadow: none !important;
        }

        /* Subtle scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #FAF8F5;
        }
        ::-webkit-scrollbar-thumb {
            background: #E2DDCF;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #A1A1AA;
        }

        /* Story Card hover effects */
        .story-card {
            background: #FFFFFF;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform, box-shadow;
        }
        .story-card:hover {
            transform: translateY(-4px) scale(1.005);
            box-shadow: 0 20px 40px -12px rgba(24, 24, 27, 0.08);
        }
        .story-card:active {
            transform: translateY(-1px) scale(0.99);
        }

        /* Hero cover image zoom */
        .hero-cover-img {
            transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .hero-cover-container:hover .hero-cover-img {
            transform: scale(1.025);
        }

        /* Category pill button transitions */
        .cat-pill {
            transition: background-color 0.2s cubic-bezier(0.16, 1, 0.3, 1), 
                        color 0.2s cubic-bezier(0.16, 1, 0.3, 1), 
                        transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), 
                        box-shadow 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .cat-pill:hover {
            transform: translateY(-1.5px);
        }
        .cat-pill:active {
            transform: translateY(0) scale(0.97);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Staggered Cascade Entrance Animation */
        @keyframes staggerIn {
            from { 
                opacity: 0; 
                transform: translateY(14px) scale(0.98); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0) scale(1); 
            }
        }
        .animate-stagger-card {
            animation: staggerIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        /* Lightbox Backdrop Fade */
        @keyframes backdropFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Lightbox Modal Card Scale-up */
        @keyframes modalScaleUp {
            from { 
                opacity: 0; 
                transform: scale(0.95) translateY(8px); 
            }
            to { 
                opacity: 1; 
                transform: scale(1) translateY(0); 
            }
        }

        .modal-backdrop {
            transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .modal-backdrop:not(.hidden) {
            animation: backdropFadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .modal-backdrop:not(.hidden) #lb-card-container {
            animation: modalScaleUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Direction-Aware Slide Animations for Lightbox */
        .lb-slide-right {
            animation: slideInRight 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .lb-slide-left {
            animation: slideInLeft 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .lb-fade-swap {
            animation: fadeSwap 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideInRight {
            0% { opacity: 0.15; transform: translateX(36px) scale(0.98); }
            100% { opacity: 1; transform: translateX(0) scale(1); }
        }
        @keyframes slideInLeft {
            0% { opacity: 0.15; transform: translateX(-36px) scale(0.98); }
            100% { opacity: 1; transform: translateX(0) scale(1); }
        }
        @keyframes fadeSwap {
            0% { opacity: 0.2; transform: scale(0.97); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Image Lazy Load Fade-In */
        .img-fade-in {
            opacity: 0;
            transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .img-fade-in.loaded {
            opacity: 1;
        }

        /* Shimmer Skeleton Placeholder to prevent layout shifts */
        .img-skeleton {
            background-color: #EFEBE1;
            background-image: linear-gradient(90deg, #EFEBE1 0%, #F4F0E6 50%, #EFEBE1 100%);
            background-size: 200% 100%;
            animation: skeletonShimmer 1.8s infinite ease-in-out;
        }
        @keyframes skeletonShimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Respect reduced motion preference */
        @media (prefers-reduced-motion: reduce) {
            *, ::before, ::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

            },
            {
                id: 'mem-4',
                title: 'Lanterns & Evening Streets',
                date: 'September 2026',
                category: 'Japan',
                description: 'Walking down the wooden streets at dusk just as the lanterns lit up.',
                imageUrl: 'images/754EEA62-81C9-4868-8B02-D23D16EBCF50.JPG'
            },
            {
                id: 'mem-5',
                title: 'Afternoon Garden Gathering',
                date: 'December 2024',
                category: 'Family',
                description: 'A sunny afternoon out in the garden with family, food, and plenty of laughs.',
                imageUrl: 'https://images.unsplash.com/photo-1511895426328-dc8714191300?auto=format&fit=crop&w=1600&q=80'
            },
            {
                id: 'mem-6',
                title: 'Birthday Cake & Smiles',
                date: 'May 2024',
                category: 'Birthday',
                description: 'Cutting the birthday cake with everyone in the room.',
                imageUrl: 'images/DSC_8253.JPG'
            },
            {
                id: 'mem-7',
                title: 'Temple Grounds & Gardens',
                date: 'September 2026',
                category: 'Japan',
                description: 'A quiet walk through the temple gardens in Japan.',
                imageUrl: 'images/C90E24E9-2677-422E-A8B7-8F1641F22481.JPG'
            },
            {
                id: 'mem-8',
                title: 'Golden Hour by the Coast',
                date: 'January 2025',
                category: 'Special Moments',
                description: 'Down by the water late in the afternoon as the sun started to go down.',
                imageUrl: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1600&q=80'
            },
            {
                id: 'mem-9',
                title: 'Quiet Afternoon Reading',
                date: 'August 2024',
                category: 'Everyday',
                description: 'Afternoon sun coming through the living room window with a book and a cup of tea.',
                imageUrl: 'https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&w=1600&q=80'
            },
            {
                id: 'mem-10',
                title: 'City Lights & Skyline View',
                date: 'September 2026',
                category: 'Japan',
                description: 'Looking out over the city lights at night after a full day of walking around.',
                imageUrl: 'images/FA08CF9C-A8C3-4AEA-AD39-E974743840B8.JPG'
            },
            {
                id: 'mem-11',
                title: 'Evening Dinner Table',
                date: 'November 2024',
                category: 'Family',
                description: 'Dinner at home with everyone catching up around the table.',
                imageUrl: 'https://images.unsplash.com/photo-1543353071-873f17a7a088?auto=format&fit=crop&w=1600&q=80'
            },
            {
                id: 'mem-12',
                title: 'First Snowfall Morning',
                date: 'February 2025',
                category: 'Special Moments',
                description: 'Waking up to fresh snow covering the trees outside.',
                imageUrl: 'https://images.unsplash.com/photo-1483921020237-2ff51e8e4b22?auto=format&fit=crop&w=1600&q=80'
            }
        ];

        // Application State
        let currentCategory = 'All';
        let filteredMemories = [...MEMORIES];
        let currentLightboxIndex = 0;
        let lastFocusedElement = null;
        let touchStartX = 0;
        let touchEndX = 0;

        // Restrained Editorial Aspect Ratios for Visual Rhythm
        const CARD_ASPECTS = [
            'aspect-[4/3]',
            'aspect-[3/2]',
            'aspect-[14/10]'
        ];

        // Escape HTML utility
        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // Optimize Unsplash URLs for fast grid thumbnails while keeping local paths intact
        function getThumbnailUrl(url) {
            if (url && url.includes('images.unsplash.com')) {
                return url.replace(/w=\d+/, 'w=640').replace(/q=\d+/, 'q=75');
            }
            return url;
        }

        // Graceful fallback if a local or external image is unavailable
        function handleImageError(img) {
            img.onerror = null;
            img.src = 'https://placehold.co/800x600/EFEBE1/71717A?text=Story+Book+Photo';
            img.classList.add('loaded');
            if (img.parentElement) {
                img.parentElement.classList.remove('img-skeleton');
            }
        }

        // Handle image load completion
        function handleImageLoad(img) {
            img.classList.add('loaded');
            if (img.parentElement) {
                img.parentElement.classList.remove('img-skeleton');
            }
        }

        // Filter Gallery by Category
        function filterCategory(category) {
            if (currentCategory === category) return;
            currentCategory = category;

            // Update pill button active states
            const pills = document.querySelectorAll('#category-bar .cat-pill');
            pills.forEach(pill => {
                const isSelected = pill.getAttribute('data-cat') === category;
                const svg = pill.querySelector('svg');

                pill.setAttribute('aria-selected', isSelected ? 'true' : 'false');

                if (isSelected) {
                    pill.classList.add('active', 'bg-charcoal-900', 'text-white', 'font-semibold', 'shadow-sm');
                    pill.classList.remove('bg-white', 'text-zinc-700', 'hover:bg-zinc-100', 'font-medium');
                    if (svg) {
                        svg.classList.add('text-white');
                        svg.classList.remove('text-zinc-500');
                    }
                } else {
                    pill.classList.remove('active', 'bg-charcoal-900', 'text-white', 'font-semibold', 'shadow-sm');
                    pill.classList.add('bg-white', 'text-zinc-700', 'hover:bg-zinc-100', 'font-medium');
                    if (svg) {
                        svg.classList.remove('text-white');
                        svg.classList.add('text-zinc-500');
                    }
                }
            });

            renderGallery();
        }

        // Render Gallery Cards
        function renderGallery() {
            const grid = document.getElementById('gallery-grid');
            const statusEl = document.getElementById('gallery-status');

            filteredMemories = MEMORIES.filter(item => {
                return (currentCategory === 'All') || (item.category === currentCategory);
            });

            if (statusEl) {
                const count = filteredMemories.length;
                const noun = count === 1 ? 'photograph' : 'photographs';
                statusEl.textContent = currentCategory === 'All'
                    ? `Showing all ${count} ${noun}`
                    : `Showing ${count} ${noun} in ${currentCategory}`;
            }

            if (filteredMemories.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-16 px-6 text-center bg-white rounded-3xl shadow-sm">
                        <p class="font-serif text-2xl text-charcoal-900 mb-2">No photographs in this category yet</p>
                        <p class="text-sm text-zinc-500">Select another category above to explore more memories.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filteredMemories.map((item, idx) => {
                const aspectClass = CARD_ASPECTS[idx % CARD_ASPECTS.length];
                const delayMs = Math.min(idx * 45, 360);
                const priorityAttr = idx < 3 ? 'fetchpriority="high" loading="eager"' : 'loading="lazy"';
                const thumbSrc = getThumbnailUrl(item.imageUrl);
                const iconSvg = CATEGORY_ICONS[item.category] || '';

                return `
                    <article 
                        tabindex="0"
                        role="button"
                        aria-label="Open memory: ${escapeHtml(item.title)}"
                        onclick="openLightbox(${idx}, this)"
                        onkeydown="if(event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openLightbox(${idx}, this); }"
                        style="animation-delay: ${delayMs}ms;"
                        class="story-card animate-stagger-card rounded-3xl overflow-hidden shadow-sm cursor-pointer flex flex-col group no-select">
                        
                        <!-- Photograph Container -->
                        <div class="relative ${aspectClass} w-full overflow-hidden img-skeleton">
                            <img 
                                src="${escapeHtml(thumbSrc)}" 
                                alt="${escapeHtml(item.title)}"
                                ${priorityAttr}
                                decoding="async"
                                draggable="false"
                                onload="handleImageLoad(this)"
                                onerror="handleImageError(this)"
                                class="w-full h-full object-cover object-center img-fade-in transition-transform duration-500 ease-out group-hover:scale-[1.03] select-none">
                            
                            <!-- Floating Category Pill -->
                            <div class="absolute top-3.5 right-3.5 px-3 py-1.5 rounded-xl bg-white/95 backdrop-blur-sm text-charcoal-800 text-xs font-medium flex items-center gap-1.5 shadow-sm">
                                ${iconSvg}
                                <span>${escapeHtml(item.category)}</span>
                            </div>
                        </div>

                        <!-- Card Text Content -->
                        <div class="p-6 flex flex-col flex-grow space-y-2.5">
                            <div class="space-y-1.5">
                                <p class="text-xs font-semibold text-terracotta-600 tracking-wide">
                                    ${escapeHtml(item.date)}
                                </p>
                                <h2 class="font-serif text-2xl font-semibold text-charcoal-900 leading-snug group-hover:text-terracotta-700 transition-colors">
                                    ${escapeHtml(item.title)}
                                </h2>
                            </div>
                            <p class="text-sm text-charcoal-700 leading-relaxed line-clamp-3">
                                ${escapeHtml(item.description)}
                            </p>
                        </div>
                    </article>
                `;
            }).join('');
        }

        // Preload adjacent high-resolution photos for seamless lightbox navigation
        function preloadNeighborImages(idx) {
            if (filteredMemories.length <= 1) return;
            const prevIdx = (idx - 1 + filteredMemories.length) % filteredMemories.length;
            const nextIdx = (idx + 1) % filteredMemories.length;

            [prevIdx, nextIdx].forEach(i => {
                const preloadImg = new Image();
                preloadImg.src = filteredMemories[i].imageUrl;
            });
        }

        // Open Fullscreen Lightbox Viewer
        function openLightbox(idx, triggerEl) {
            if (!filteredMemories[idx]) return;
            lastFocusedElement = triggerEl || document.activeElement;
            currentLightboxIndex = idx;

            const lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('hidden');
            document.body.style.overflow = 'hidden';

            renderLightboxContent(idx, 'none');

            const closeBtn = document.getElementById('lb-close-btn');
            if (closeBtn) {
                setTimeout(() => closeBtn.focus(), 20);
            }
        }

        // Populate Lightbox Photo & Details
        function renderLightboxContent(idx, direction) {
            const item = filteredMemories[idx];
            if (!item) return;

            const imgEl = document.getElementById('lb-image');
            const panelEl = document.getElementById('lb-details-panel');

            // Reset transition classes cleanly
            imgEl.classList.remove('lb-slide-right', 'lb-slide-left', 'lb-fade-swap');
            panelEl.classList.remove('lb-fade-swap');
            void imgEl.offsetWidth;

            if (direction === 'next') {
                imgEl.classList.add('lb-slide-right');
                panelEl.classList.add('lb-fade-swap');
            } else if (direction === 'prev') {
                imgEl.classList.add('lb-slide-left');
                panelEl.classList.add('lb-fade-swap');
            } else {
                imgEl.classList.add('lb-fade-swap');
            }

            imgEl.onerror = function() {
                this.onerror = null;
                this.src = 'https://placehold.co/1200x900/27272A/E4E4E7?text=Story+Book+Photo';
            };
            imgEl.src = item.imageUrl;
            imgEl.alt = item.title;

            document.getElementById('lb-date').textContent = item.date;
            document.getElementById('lb-category-pill').innerHTML = `${CATEGORY_ICONS[item.category] || ''} ${escapeHtml(item.category)}`;
            document.getElementById('lb-title').textContent = item.title;
            document.getElementById('lb-description').textContent = item.description;
            document.getElementById('lb-counter').textContent = `${idx + 1} / ${filteredMemories.length}`;

            preloadNeighborImages(idx);
        }

        // Navigate Next or Previous Photo in Lightbox
        function navigateLightbox(step) {
            if (filteredMemories.length <= 1) return;
            currentLightboxIndex = (currentLightboxIndex + step + filteredMemories.length) % filteredMemories.length;
            const direction = step > 0 ? 'next' : 'prev';
            renderLightboxContent(currentLightboxIndex, direction);
        }

        // Close Lightbox Viewer
        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            if (lightbox.classList.contains('hidden')) return;

            lightbox.classList.add('hidden');
            document.body.style.overflow = '';

            if (lastFocusedElement && typeof lastFocusedElement.focus === 'function') {
                lastFocusedElement.focus();
            }
        }

        // Backdrop Click Handler
        document.getElementById('lightbox').addEventListener('click', function(e) {
            if (e.target === this) {
                closeLightbox();
            }
        });

        // Keyboard Navigation & Focus Trap
        document.addEventListener('keydown', function(e) {
            const lightbox = document.getElementById('lightbox');
            if (lightbox.classList.contains('hidden')) return;

            if (e.key === 'Escape') {
                e.preventDefault();
                closeLightbox();
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                navigateLightbox(1);
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                navigateLightbox(-1);
            } else if (e.key === 'Tab') {
                const focusable = lightbox.querySelectorAll('button:not([disabled])');
                if (focusable.length === 0) return;
                const first = focusable[0];
                const last = focusable[focusable.length - 1];

                if (e.shiftKey && document.activeElement === first) {
                    e.preventDefault();
                    last.focus();
                } else if (!e.shiftKey && document.activeElement === last) {
                    e.preventDefault();
                    first.focus();
                }
            }
        });

        // Mobile Touch Swipe Support inside Lightbox
        const lbContainer = document.getElementById('lb-card-container');
        lbContainer.addEventListener('touchstart', function(e) {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        lbContainer.addEventListener('touchend', function(e) {
            touchEndX = e.changedTouches[0].screenX;
            const deltaX = touchEndX - touchStartX;
            if (Math.abs(deltaX) > 45) {
                if (deltaX < 0) {
                    navigateLightbox(1);
                } else {
                    navigateLightbox(-1);
                }
            }
        }, { passive: true });

        // Initialize Gallery on Page Load
        window.addEventListener('DOMContentLoaded', () => {
            renderGallery();
        });
    </script>
