<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Book</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sand: {
                            50: '#FDFBF7',
                            100: '#FAFAFA',
                            200: '#F4F4F5',
                            300: '#E4E4E7',
                            400: '#D4D4D8'
                        },
                        charcoal: {
                            700: '#3F3F46',
                            800: '#27272A',
                            900: '#18181B'
                        },
                        amberAccent: {
                            600: '#B45309',
                            700: '#92400E'
                        }
                    },
                    fontFamily: {
                        serif: ['Cormorant Garamond', 'Georgia', 'serif'],
                        sans: ['Plus Jakarta Sans', '-apple-system', 'BlinkMacSystemFont', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #FAFAFA;
            color: #18181B;
        }

        .paper-bg {
            background-color: #FAFAFA;
            background-image: radial-gradient(#E4E4E7 0.75px, transparent 0.75px);
            background-size: 16px 16px;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #FAFAFA;
        }
        ::-webkit-scrollbar-thumb {
            background: #D4D4D8;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #A1A1AA;
        }

        .story-card {
            background: #FFFFFF;
            border: 1px solid #E4E4E7;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        }
        .story-card:hover {
            transform: translateY(-4px);
            border-color: #D4D4D8;
            box-shadow: 0 16px 32px -8px rgba(24, 24, 27, 0.08);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="paper-bg font-sans min-h-screen flex flex-col antialiased selection:bg-charcoal-900 selection:text-white">

    <!-- ================= TOP NAVIGATION BAR ================= -->
    <header class="border-b border-sand-300 bg-white/90 sticky top-0 z-30 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl border border-sand-300 bg-sand-100 flex items-center justify-center text-charcoal-900 shrink-0">
                    <svg class="w-4 h-4" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 3h12a1 1 0 0 1 1 1v13.5l-5-3-5 3V4a1 1 0 0 1 1-1z"/>
                    </svg>
                </div>
                <h1 class="font-serif text-2xl font-semibold text-charcoal-900 tracking-tight leading-none">Story Book</h1>
            </div>

            <div class="text-xs text-zinc-400 font-medium">
                Photo Album
            </div>

        </div>
    </header>

    <!-- ================= HERO COVER SECTION ================= -->
    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 sm:pt-8 pb-6 w-full">
        <div class="relative w-full rounded-3xl overflow-hidden border border-sand-300 bg-white p-3 sm:p-4 shadow-sm">
            <div class="relative h-[280px] sm:h-[380px] md:h-[440px] w-full rounded-2xl overflow-hidden bg-sand-200">
                
                <img src="https://images.unsplash.com/photo-1511895426328-dc8714191300?auto=format&fit=crop&w=2000&q=80" 
                     alt="Cover" class="w-full h-full object-cover filter brightness-[0.92] contrast-[1.02]">
                
                <div class="absolute inset-0 bg-gradient-to-t from-charcoal-900/75 via-charcoal-900/20 to-transparent"></div>

                <div class="absolute bottom-0 left-0 right-0 p-6 sm:p-10 text-white">
                    <h2 class="font-serif text-4xl sm:text-6xl md:text-7xl font-semibold tracking-tight leading-tight">
                        Story Book
                    </h2>
                </div>

            </div>
        </div>
    </section>

    <!-- ================= MAIN CONTENT & CATEGORIES ================= -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 w-full flex-grow space-y-8">

        <!-- CATEGORY NAVIGATION BAR -->
        <div class="flex items-center justify-between border-b border-sand-300 pb-5">
            
            <div class="flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar" id="category-bar">
                
                <!-- ALL -->
                <button onclick="filterCategory('All')" data-cat="All" class="cat-pill active px-4 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 transition-all border border-zinc-900 bg-zinc-900 text-white shadow-sm shrink-0">
                    <svg class="w-4 h-4 shrink-0 text-white" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="6" height="6" rx="1.5"/>
                        <rect x="11" y="3" width="6" height="6" rx="1.5"/>
                        <rect x="11" y="11" width="6" height="6" rx="1.5"/>
                        <rect x="3" y="11" width="6" height="6" rx="1.5"/>
                    </svg>
                    <span>All</span>
                </button>

                <!-- EVERYDAY -->
                <button onclick="filterCategory('Everyday')" data-cat="Everyday" class="cat-pill px-4 py-2 rounded-xl text-xs font-medium flex items-center gap-2 transition-all border border-zinc-200 bg-white text-zinc-600 hover:border-zinc-300 hover:bg-zinc-50 shrink-0">
                    <svg class="w-4 h-4 shrink-0 text-zinc-500" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 6h10v7a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V6z"/>
                        <path d="M14 8h2a2 2 0 0 1 2 2v0a2 2 0 0 1-2 2h-2"/>
                        <path d="M6 2v2M10 2v2M14 2v2"/>
                    </svg>
                    <span>Everyday</span>
                </button>

                <!-- JAPAN -->
                <button onclick="filterCategory('Japan')" data-cat="Japan" class="cat-pill px-4 py-2 rounded-xl text-xs font-medium flex items-center gap-2 transition-all border border-zinc-200 bg-white text-zinc-600 hover:border-zinc-300 hover:bg-zinc-50 shrink-0">
                    <svg class="w-4 h-4 shrink-0 text-zinc-500" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 5h14M2 8h16M6 8v9M14 8v9M6 12h8"/>
                    </svg>
                    <span>Japan</span>
                </button>

                <!-- CHILDHOOD -->
                <button onclick="filterCategory('Childhood')" data-cat="Childhood" class="cat-pill px-4 py-2 rounded-xl text-xs font-medium flex items-center gap-2 transition-all border border-zinc-200 bg-white text-zinc-600 hover:border-zinc-300 hover:bg-zinc-50 shrink-0">
                    <svg class="w-4 h-4 shrink-0 text-zinc-500" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="14" height="14" rx="3"/>
                        <path d="M7 14l3-7 3 7M8.2 11h3.6"/>
                    </svg>
                    <span>Childhood</span>
                </button>

                <!-- FAMILY -->
                <button onclick="filterCategory('Family')" data-cat="Family" class="cat-pill px-4 py-2 rounded-xl text-xs font-medium flex items-center gap-2 transition-all border border-zinc-200 bg-white text-zinc-600 hover:border-zinc-300 hover:bg-zinc-50 shrink-0">
                    <svg class="w-4 h-4 shrink-0 text-zinc-500" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="7" cy="6" r="2.5"/>
                        <path d="M2 17v-1a3.5 3.5 0 0 1 3.5-3.5h3A3.5 3.5 0 0 1 12 16v1"/>
                        <circle cx="14" cy="7" r="2"/>
                        <path d="M11.5 17v-.5a2.5 2.5 0 0 1 2.5-2.5h1.5a2.5 2.5 0 0 1 2.5 2.5v.5"/>
                    </svg>
                    <span>Family</span>
                </button>

                <!-- SPECIAL MOMENTS -->
                <button onclick="filterCategory('Special Moments')" data-cat="Special Moments" class="cat-pill px-4 py-2 rounded-xl text-xs font-medium flex items-center gap-2 transition-all border border-zinc-200 bg-white text-zinc-600 hover:border-zinc-300 hover:bg-zinc-50 shrink-0">
                    <svg class="w-4 h-4 shrink-0 text-zinc-500" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="10 2 12.5 7.5 18 8.2 14 12 15 17.5 10 14.8 5 17.5 6 12 2 8.2 7.5 10 2"/>
                    </svg>
                    <span>Special Moments</span>
                </button>

            </div>

            <div class="text-xs text-zinc-500 font-medium shrink-0 hidden sm:block">
                <span id="memory-count" class="font-semibold text-charcoal-900">0</span> memories
            </div>

        </div>

        <!-- PHOTO GALLERY GRID -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6" id="gallery-grid">
            <!-- Dynamic Photo Cards Render Here -->
        </div>

    </main>

    <!-- ================= FOOTER ================= -->
    <footer class="border-t border-sand-300 bg-white py-8 mt-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between text-xs text-zinc-400">
            <div class="font-serif text-lg font-semibold text-charcoal-900">Story Book</div>
            <div>Photo Album</div>
        </div>
    </footer>

    <!-- ================= FULLSCREEN LIGHTBOX MODAL ================= -->
    <div id="lightbox" class="fixed inset-0 z-50 hidden bg-charcoal-900/90 backdrop-blur-md flex items-center justify-center p-4 sm:p-6">
        <div class="relative max-w-4xl w-full bg-white rounded-3xl overflow-hidden shadow-2xl flex flex-col md:flex-row max-h-[90vh]">
            
            <button onclick="closeLightbox()" class="absolute top-4 right-4 z-20 w-9 h-9 rounded-full bg-charcoal-900/60 hover:bg-charcoal-900 text-white flex items-center justify-center text-sm transition-colors">
                <svg class="w-4 h-4" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 5l10 10M15 5L5 15"/>
                </svg>
            </button>

            <div class="relative flex-1 bg-charcoal-900 flex items-center justify-center min-h-[300px] md:min-h-[480px]">
                <img id="lb-image" src="" alt="" class="max-h-[75vh] w-auto max-w-full object-contain p-2">
                
                <button onclick="navigateLightbox(-1)" class="absolute left-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-white/20 hover:bg-white/40 text-white flex items-center justify-center transition-all">
                    <svg class="w-5 h-5" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12.5 15L7.5 10l5-5"/>
                    </svg>
                </button>
                <button onclick="navigateLightbox(1)" class="absolute right-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-white/20 hover:bg-white/40 text-white flex items-center justify-center transition-all">
                    <svg class="w-5 h-5" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M7.5 15l5-5-5-5"/>
                    </svg>
                </button>
            </div>

            <div class="w-full md:w-80 p-6 sm:p-8 bg-sand-50 flex flex-col justify-between border-t md:border-t-0 md:border-l border-sand-300 overflow-y-auto">
                <div class="space-y-4">
                    <div class="flex items-center justify-between text-xs text-amberAccent-600 font-semibold">
                        <span id="lb-date"></span>
                        <span id="lb-category-pill" class="px-2.5 py-1 bg-sand-200 text-charcoal-800 rounded-lg text-[11px] font-medium flex items-center gap-1.5"></span>
                    </div>

                    <h3 id="lb-title" class="font-serif text-2xl font-semibold text-charcoal-900 leading-tight"></h3>

                    <div class="w-8 h-0.5 bg-amberAccent-600"></div>

                    <p id="lb-description" class="text-xs sm:text-sm text-charcoal-700 leading-relaxed font-normal"></p>
                </div>

                <div class="pt-6 mt-6 border-t border-sand-300 text-xs text-zinc-400 flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10 2a6 6 0 0 0-6 6c0 4.5 6 10 6 10s6-5.5 6-10a6 6 0 0 0-6-6z"/>
                        <circle cx="10" cy="8" r="2"/>
                    </svg>
                    <span id="lb-location"></span>
                </div>
            </div>

        </div>
    </div>

    <!-- ================= JAVASCRIPT APPLICATION CODE ================= -->
    <script>
        const CATEGORY_ICONS = {
            'Everyday': `<svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10v7a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V6z"/><path d="M14 8h2a2 2 0 0 1 2 2v0a2 2 0 0 1-2 2h-2"/><path d="M6 2v2M10 2v2M14 2v2"/></svg>`,
            'Japan': `<svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h14M2 8h16M6 8v9M14 8v9M6 12h8"/></svg>`,
            'Childhood': `<svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="14" height="14" rx="3"/><path d="M7 14l3-7 3 7M8.2 11h3.6"/></svg>`,
            'Family': `<svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="6" r="2.5"/><path d="M2 17v-1a3.5 3.5 0 0 1 3.5-3.5h3A3.5 3.5 0 0 1 12 16v1"/><circle cx="14" cy="7" r="2"/><path d="M11.5 17v-.5a2.5 2.5 0 0 1 2.5-2.5h1.5a2.5 2.5 0 0 1 2.5 2.5v.5"/></svg>`,
            'Special Moments': `<svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="10 2 12.5 7.5 18 8.2 14 12 15 17.5 10 14.8 5 17.5 6 12 2 8.2 7.5 10 2"/></svg>`
        };

        const MEMORIES = [
            {
                id: 'mem-1',
                title: 'Kyoto Bamboo Path Stroll',
                date: 'April 2019',
                location: 'Kyoto, Japan',
                category: 'Japan',
                description: 'Walking through the quiet bamboo grove early in the morning before the crowds arrived. Sunlight filtered through the tall green stalks.',
                imageUrl: 'https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=1000&q=80'
            },
            {
                id: 'mem-2',
                title: 'First Bike Without Training Wheels',
                date: 'May 1999',
                location: 'Oak Street Driveway',
                category: 'Childhood',
                description: 'Running right behind the little blue bicycle down the sidewalk, holding the seat until balancing came naturally on the open road.',
                imageUrl: 'https://images.unsplash.com/photo-1507035895480-2b3156c31fc8?auto=format&fit=crop&w=1000&q=80'
            },
            {
                id: 'mem-3',
                title: 'Sunday Morning Pancakes & Coffee',
                date: 'October 2012',
                location: 'Home Kitchen',
                category: 'Everyday',
                description: 'The warm weekend routine. Mixing pancake batter in the yellow bowl while fresh coffee brews on the kitchen counter.',
                imageUrl: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=1000&q=80'
            },
            {
                id: 'mem-4',
                title: 'Silver Wedding Anniversary Toast',
                date: 'September 2018',
                location: 'Napa Valley, California',
                category: 'Special Moments',
                description: 'Celebrating 25 wonderful years surrounded by lifelong friends and family at an outdoor vineyard table at sunset.',
                imageUrl: 'https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1000&q=80'
            },
            {
                id: 'mem-5',
                title: 'Summer Lake House Cabin',
                date: 'July 2014',
                location: 'Lake Tahoe, Nevada',
                category: 'Family',
                description: 'Two full weeks spent on the wooden dock swimming, reading, and taking evening boat trips around the quiet bay.',
                imageUrl: 'https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?auto=format&fit=crop&w=1000&q=80'
            },
            {
                id: 'mem-6',
                title: 'Evening Lanterns in Asakusa',
                date: 'April 2019',
                location: 'Tokyo, Japan',
                category: 'Japan',
                description: 'Exploring the illuminated side streets of Tokyo after dinner. Warm red lanterns lit up every wooden storefront.',
                imageUrl: 'https://images.unsplash.com/photo-1503899036084-c55cdd92da26?auto=format&fit=crop&w=1000&q=80'
            },
            {
                id: 'mem-7',
                title: 'Building Forts in the Backyard',
                date: 'June 2002',
                location: 'Backyard Garden',
                category: 'Childhood',
                description: 'Spending summer afternoons constructing wooden tree forts and eating ice pops under the shade of the old oak tree.',
                imageUrl: 'https://images.unsplash.com/photo-1517486808906-6ca8b3f04846?auto=format&fit=crop&w=1000&q=80'
            },
            {
                id: 'mem-8',
                title: 'Rainy Afternoon Board Games',
                date: 'November 2016',
                location: 'Living Room',
                category: 'Everyday',
                description: 'A storm rolled in after lunch so we lit the fireplace, poured hot cinnamon tea, and played classic board games until dinner.',
                imageUrl: 'https://images.unsplash.com/photo-1511193311914-0346f16efe90?auto=format&fit=crop&w=1000&q=80'
            },
            {
                id: 'mem-9',
                title: 'University Graduation Ceremony',
                date: 'June 2017',
                location: 'University Campus Lawn',
                category: 'Special Moments',
                description: 'Standing proudly on the quad after the cap toss. A momentous milestone recorded on a crisp sunny day.',
                imageUrl: 'https://images.unsplash.com/photo-1523050854058-8df90110c9f1?auto=format&fit=crop&w=1000&q=80'
            },
            {
                id: 'mem-10',
                title: 'Autumn Trail Hike',
                date: 'October 2021',
                location: 'Blue Ridge Mountains',
                category: 'Family',
                description: 'Hiking through golden aspen and maple trees on our annual autumn trip into the mountains.',
                imageUrl: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1000&q=80'
            }
        ];

        let currentCategory = 'All';
        let filteredMemories = [...MEMORIES];
        let currentLightboxIndex = -1;

        document.addEventListener('DOMContentLoaded', () => {
            renderGallery();

            document.addEventListener('keydown', (e) => {
                const lb = document.getElementById('lightbox');
                if (!lb.classList.contains('hidden')) {
                    if (e.key === 'Escape') closeLightbox();
                    if (e.key === 'ArrowLeft') navigateLightbox(-1);
                    if (e.key === 'ArrowRight') navigateLightbox(1);
                }
            });
        });

        function filterCategory(cat) {
            currentCategory = cat;

            document.querySelectorAll('.cat-pill').forEach(btn => {
                const btnCat = btn.getAttribute('data-cat');
                const svg = btn.querySelector('svg');
                if (btnCat === cat) {
                    btn.className = "cat-pill active px-4 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 transition-all border border-zinc-900 bg-zinc-900 text-white shadow-sm shrink-0";
                    if (svg) {
                        svg.classList.remove('text-zinc-500');
                        svg.classList.add('text-white');
                    }
                } else {
                    btn.className = "cat-pill px-4 py-2 rounded-xl text-xs font-medium flex items-center gap-2 transition-all border border-zinc-200 bg-white text-zinc-600 hover:border-zinc-300 hover:bg-zinc-50 shrink-0";
                    if (svg) {
                        svg.classList.remove('text-white');
                        svg.classList.add('text-zinc-500');
                    }
                }
            });

            renderGallery();
        }

        function renderGallery() {
            const grid = document.getElementById('gallery-grid');

            filteredMemories = MEMORIES.filter(item => {
                return (currentCategory === 'All') || (item.category === currentCategory);
            });

            document.getElementById('memory-count').textContent = filteredMemories.length;

            grid.innerHTML = filteredMemories.map((item, idx) => `
                <article class="story-card rounded-3xl overflow-hidden cursor-pointer group animate-fade-in flex flex-col justify-between" onclick="openLightbox(${idx})">
                    
                    <div>
                        <div class="relative h-56 sm:h-60 w-full overflow-hidden bg-sand-200">
                            <img src="${item.imageUrl}" alt="${escapeHtml(item.title)}" 
                                 class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
                                 onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1511895426328-dc8714191300?auto=format&fit=crop&w=800&q=80';">
                            
                            <div class="absolute top-3.5 right-3.5 px-3 py-1 bg-white/90 backdrop-blur-md text-charcoal-900 border border-sand-300 rounded-lg text-[11px] font-semibold flex items-center gap-1.5 shadow-sm">
                                ${CATEGORY_ICONS[item.category] || ''}
                                <span>${escapeHtml(item.category)}</span>
                            </div>
                        </div>

                        <div class="p-6 space-y-3">
                            <div class="flex items-center justify-between text-xs font-semibold text-amberAccent-600">
                                <span>${escapeHtml(item.date)}</span>
                                <span class="text-zinc-400 font-normal flex items-center gap-1">
                                    <svg class="w-3 h-3" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M10 2a6 6 0 0 0-6 6c0 4.5 6 10 6 10s6-5.5 6-10a6 6 0 0 0-6-6z"/>
                                        <circle cx="10" cy="8" r="2"/>
                                    </svg>
                                    ${escapeHtml(item.location)}
                                </span>
                            </div>

                            <h3 class="font-serif text-2xl font-semibold text-charcoal-900 group-hover:text-amberAccent-600 transition-colors leading-snug">
                                ${escapeHtml(item.title)}
                            </h3>

                            <p class="text-xs text-charcoal-700 leading-relaxed line-clamp-3 font-normal">
                                ${escapeHtml(item.description)}
                            </p>
                        </div>
                    </div>

                </article>
            `).join('');
        }

        function openLightbox(idx) {
            currentLightboxIndex = idx;
            const item = filteredMemories[idx];
            if (!item) return;

            document.getElementById('lb-image').src = item.imageUrl;
            document.getElementById('lb-date').textContent = item.date;
            document.getElementById('lb-category-pill').innerHTML = `${CATEGORY_ICONS[item.category] || ''} ${escapeHtml(item.category)}`;
            document.getElementById('lb-title').textContent = item.title;
            document.getElementById('lb-description').textContent = item.description;
            document.getElementById('lb-location').textContent = item.location;

            document.getElementById('lightbox').classList.remove('hidden');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.add('hidden');
        }

        function navigateLightbox(dir) {
            if (filteredMemories.length === 0) return;
            currentLightboxIndex += dir;
            if (currentLightboxIndex < 0) currentLightboxIndex = filteredMemories.length - 1;
            if (currentLightboxIndex >= filteredMemories.length) currentLightboxIndex = 0;
            openLightbox(currentLightboxIndex);
        }

        function escapeHtml(str) {
            return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
